<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Terminal</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Courier New", monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            padding: 60px 20px;
            overflow: hidden;
        }

        /* ВЕРХНИЙ ПИКСЕЛЬНЫЙ ТЕКСТ */
        .header-text {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #333;
            user-select: none;
        }

        /* ЭКРАН ПОСЛЕ ПРАВИЛЬНОГО ВВОДА */
        .result-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        /* ГИФКА НА ВЕСЬ ЭКРАН ПОСЛЕ ВВОДА */
        .noise-gif-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* КРЕСТОВИНА ГЕЙМПАДА (УВЕЛИЧЕННАЯ) */
        .dpad-container {
            margin-bottom: 40px;
            user-select: none;
        }

        .dpad {
            display: grid;
            grid-template-columns: 60px 110px 60px;
            grid-template-rows: 70px 120px 70px;
            align-items: center;
            justify-items: center;
            gap: 15px; /* Зазоры между кнопками */
        }

        .dpad-btn {
            image-rendering: pixelated;
            cursor: pointer;
            -webkit-user-drag: none;
        }

        .btn-up {
            grid-column: 2; grid-row: 1;
            width: 110px; height: 63px; 
        }
        .btn-left {
            grid-column: 1; grid-row: 2;
            width: 56px; height: 120px; 
        }
        .btn-centre {
            grid-column: 2; grid-row: 2;
            width: 110px; height: 110px; 
        }
        .btn-right {
            grid-column: 3; grid-row: 2;
            width: 56px; height: 120px; 
        }
        .btn-down {
            grid-column: 2; grid-row: 3;
            width: 110px; height: 63px; 
        }
    </style>
</head>
<body>

    <div class="header-text" id="headerText">
        Женщина, Искусство, Испуг, Бессмыслица, Жизнь
    </div>

    <!-- ЭКРАН ШУМА (ГИФКА NOISE.GIF) -->
    <div id="resultScreen" class="result-screen">
        <img src="noise.gif" alt="noise" class="noise-gif-bg">
    </div>

    <div class="dpad-container">
        <div class="dpad">
            <!-- ВВЕРХ -->
            <img src="up1.png" alt="Up" class="dpad-btn btn-up" 
                 onmousedown="p(this, 'up2.png')" onmouseup="r(this, 'up1.png', 11)"
                 onmouseleave="r(this, 'up1.png')" ontouchstart="p(this, 'up2.png'); event.preventDefault();" ontouchend="r(this, 'up1.png', 11)">
            
            <!-- ЛЕВО -->
            <img src="LeFt1.png" alt="Left" class="dpad-btn btn-left" 
                 onmousedown="p(this, 'LeFt2.png')" onmouseup="r(this, 'LeFt1.png', 22)"
                 onmouseleave="r(this, 'LeFt1.png')" ontouchstart="p(this, 'LeFt2.png'); event.preventDefault();" ontouchend="r(this, 'LeFt1.png', 22)">
            
            <!-- ЦЕНТР -->
            <img src="centre1.png" alt="Centre" class="dpad-btn btn-centre" 
                 onmousedown="p(this, 'centre2.png')" onmouseup="r(this, 'centre1.png', 33)"
                 onmouseleave="r(this, 'centre1.png')" ontouchstart="p(this, 'centre2.png'); event.preventDefault();" ontouchend="r(this, 'centre1.png', 33)">
            
            <!-- ПРАВО -->
            <img src="Right1.png" alt="Right" class="dpad-btn btn-right" 
                 onmousedown="p(this, 'Right2.png')" onmouseup="r(this, 'Right1.png', 44)"
                 onmouseleave="r(this, 'Right1.png')" ontouchstart="p(this, 'Right2.png'); event.preventDefault();" ontouchend="r(this, 'Right1.png', 44)">
            
            <!-- НИЗ -->
            <img src="down1.png" alt="Down" class="dpad-btn btn-down" 
                 onmousedown="p(this, 'down2.png')" onmouseup="r(this, 'down1.png', 55)"
                 onmouseleave="r(this, 'down1.png')" ontouchstart="p(this, 'down2.png'); event.preventDefault();" ontouchend="r(this, 'down1.png', 55)">
        </div>
    </div>

    <script>
        // Зашифрованная последовательность кнопок (Лево, Низ, Лево, Право, Низ)
        const chain = [22, 55, 22, 44, 55];
        let progress = [];

        function p(e, s) { 
            e.src = s; 
        }

        function r(e, s, d) {
            e.src = s;
            if (!d) return;

            if (d === chain[progress.length]) {
                progress.push(d);
                if (progress.length === chain.length) {
                    executeFinalSequence();
                }
            } else {
                progress = [];
            }
        }
